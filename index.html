<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LESKEON | ROBLOX</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #05070A;
    color: #FFFFFF;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 16px;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(0,175,255,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,175,255,.08) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

.container {
    width: 100%;
    max-width: 520px;
    position: relative;
    z-index: 1;
    text-align: center;
}

.avatar {
    width: 150px;
    height: 150px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #00E5FF;
    box-shadow:
        0 0 15px #00AFFF,
        0 0 40px rgba(0,229,255,.5);
    background: #05070A;
}

h1 {
    margin-top: 20px;
    font-size: 30px;
    letter-spacing: 1px;
}

.username {
    margin-top: 7px;
    color: #00E5FF;
    font-size: 17px;
}

.tag {
    margin: 18px 0;
    color: #FFFFFF;
    font-weight: bold;
    letter-spacing: .5px;
}

.live {
    border: 1px solid #00E5FF;
    border-radius: 16px;
    padding: 20px;
    margin: 20px 0;
    background: rgba(0,175,255,.08);
    box-shadow: 0 0 25px rgba(0,175,255,.15);
}

.live-title {
    font-size: 20px;
    font-weight: bold;
}

.live-time {
    margin-top: 8px;
    color: #00E5FF;
    font-size: 25px;
    font-weight: bold;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 13px;
    margin-top: 22px;
}

.links a {
    display: block;
    padding: 16px;
    border-radius: 12px;
    text-decoration: none;
    color: #FFFFFF;
    font-size: 17px;
    font-weight: bold;
    background: #151B22;
    border: 1px solid #27313B;
    transition: .2s;
}

.links a:hover {
    border-color: #00E5FF;
    box-shadow: 0 0 15px rgba(0,229,255,.3);
    transform: translateY(-2px);
}

.footer {
    margin-top: 30px;
    color: #777F88;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <img
        class="avatar"
        src="leskeon-avatar-completo.png"
        alt="Avatar do Leskeon"
    >

    <h1>LESKEON | ROBLOX</h1>

    <div class="username">@leskeon</div>

    <div class="tag">🐈‍⬛ ENTROU NO MUNDO DO LESKEON.</div>

    <div class="live">
        <div class="live-title">🔴 AO VIVO TODOS OS DIAS</div>
        <div class="live-time">16H → 22H</div>
    </div>

    <div class="links">

        <a href="https://www.instagram.com/leskeon" target="_blank">
            📸 Instagram · @leskeon
        </a>

        <a href="https://www.youtube.com/@leskeon" target="_blank">
            ▶️ YouTube · @leskeon
        </a>

        <a href="https://www.kwai.com/@leskeon" target="_blank">
            🎬 Kwai · @leskeon
        </a>

        <a href="https://www.tiktok.com/@leskeon.line" target="_blank">
            🎵 TikTok · @leskeon.line
        </a>

    </div>

    <div class="footer">
        LESKEON · Roblox Creator
    </div>

</div>

</body>
</html>
